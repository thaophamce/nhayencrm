services:
  chat-site:
    build:
      context: ../..
      dockerfile: frontend/deploy/Dockerfile.chat
    container_name: zalo-crm-chat-site
    restart: unless-stopped
    ports:
      - "127.0.0.1:3081:80"
    depends_on:
      app:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
